<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.8" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="100" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Background subtle circular aura -->
  <circle cx="256" cy="256" r="160" fill="#3b82f6" fill-opacity="0.08" />

  <!-- Athletic Pulse & Performance Curves -->
  <path d="M 64 270 L 140 270 L 175 220 L 210 320 L 255 140 L 300 370 L 335 240 L 365 285 L 390 270 L 448 270"
        fill="none"
        stroke="url(#pulseGrad)"
        stroke-width="20"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#neonGlow)" />

  <!-- Banister EMA secondary curve -->
  <path d="M 90 320 Q 220 280 270 210 T 430 180"
        fill="none"
        stroke="#10b981"
        stroke-width="8"
        stroke-dasharray="14 10"
        stroke-linecap="round"
        opacity="0.75" />

  <!-- Peak indicator star/dot -->
  <circle cx="255" cy="140" r="14" fill="#60a5fa" filter="url(#neonGlow)" />
  <circle cx="255" cy="140" r="7" fill="#ffffff" />

  <!-- PRO badge in corner -->
  <g transform="translate(340, 95)">
    <rect width="84" height="34" rx="10" fill="#3b82f6" fill-opacity="0.25" stroke="#60a5fa" stroke-width="2" />
    <text x="42" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#93c5fd" text-anchor="middle" letter-spacing="2">PRO</text>
  </g>
</svg>
